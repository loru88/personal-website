name: Build and deploy personal website

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: personal-website-dist
          path: public/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish over FTPS
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: personal-website-dist
          path: public/

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Publish site at domain root over explicit FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_ROOT: ${{ vars.FTP_REMOTE_ROOT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          test -n "$FTP_HOST"
          test -n "$FTP_PORT"
          test -n "$FTP_REMOTE_ROOT"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

          lftp -c "set cmd:fail-exit yes; debug -t 9; set net:timeout 30; set net:max-retries 1; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; set ssl:verify-certificate false; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST:$FTP_PORT\"; mirror --reverse --delete --delete-first --verbose=3 --no-perms --no-umask --exclude-glob localredact --exclude-glob localredact/** ./public/ $FTP_REMOTE_ROOT"
