name: Test FTP publish

on:
  workflow_dispatch:
    inputs:
      ftp_host:
        description: FTP host to test
        required: true
        type: choice
        options:
          - repository secret
          - ftp.lorenzoadinolfi.it
          - 217.64.195.245
        default: repository secret
      remote_root:
        description: FTP directory to test
        required: true
        type: choice
        options:
          - repository variable
          - .
          - /htdocs
          - /
        default: repository variable

permissions:
  contents: read

concurrency:
  group: ftp-publish-test
  cancel-in-progress: false

jobs:
  publish-probe:
    name: Publish one test file
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Create a unique probe file
        run: printf 'FTP publish probe from GitHub Actions run %s\n' "$GITHUB_RUN_ID" > github.txt

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload probe over explicit FTPS
        env:
          FTP_HOST: ${{ inputs.ftp_host == 'repository secret' && secrets.FTP_HOST || inputs.ftp_host }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_REMOTE_ROOT: ${{ inputs.remote_root == 'repository variable' && vars.FTP_REMOTE_ROOT || inputs.remote_root }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -eu
          test -n "$FTP_HOST"
          test -n "$FTP_PORT"
          test -n "$FTP_REMOTE_ROOT"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

          lftp -c "set cmd:fail-exit yes; debug -t 9; set net:timeout 30; set net:max-retries 1; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:passive-mode true; set ssl:verify-certificate false; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"ftp://$FTP_HOST:$FTP_PORT\"; cd \"$FTP_REMOTE_ROOT\"; put ./github.txt -o github.txt; bye"
